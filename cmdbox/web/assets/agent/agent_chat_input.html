<div class="input-group input-group-sf m-0">
    <div class="dropdown">
        <button id="btn_ctrl" class="btn btn-sf-icon" data-bs-toggle="dropdown" style="border:none;">
            <i class="fas fa-plus"></i>
        </button>
        <ul class="dropdown-menu text-small shadow" style="position:absolute;inset:0px 0px auto auto;margin:0px;transform:translate(0px, 34px);width:200px" data-popper-placement="bottom-end">
            <li>
                <button id="display_runner_name_menu" type="button" class="dropdown-item text-wrap" title="Click to select runner">Click Here</button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li class="d-flex align-items-center ms-2" style="flex-wrap: nowrap;">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="bot_reasoning">
                    <label class="form-check-label i18n" for="bot_reasoning"></label>
                </div>
                <select id="sel_reasoning_effort" class="form-select ps-2 pt-0 pb-0 mt-1 mb-1" style="border:0px;">
                    <option value="auto" class="i18n" selected>reasoning auto</option>
                    <option value="on">on</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="xhigh">xhigh</option>
                </select>
            </li>
            <li>
                <div class="form-check form-switch ms-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="btn_rec">
                    <label class="form-check-label ms-2 i18n" for="btn_rec">Speech to Text</label>
                </div>
            </li>
            <li>
                <div class="form-check form-switch ms-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="btn_say">
                    <label class="form-check-label ms-2 i18n" for="btn_say">Text to Speech</label>
                </div>
            </li>
        </ul>
    </div>
    <div id="user_msg" class="form-control form-control-sf" contenteditable="true" placeholder="Input Message..." style="border:0px;box-shadow:none;resize:none;field-sizing:content;max-height:300px;"></div>
    <button id="btn_user_msg" class="btn btn-sf-icon" type="button">
        <i class="fas fa-paper-plane"></i>
    </button>
</div>
