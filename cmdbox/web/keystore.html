<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body lang="ja" class="overflow-hidden p-2" style="background-color:#212529;">
    <script type="text/javascript" src="assets/cmdbox/svgicon.js"></script>
    <nav class="navbar navbar-expand-sm console-header fixed-top p-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="./">cmdbox</a>
            <span class="page_title">KeyStore</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse ms-2" id="navbarNavDropdown">
                <div class="d-none dropdown user_info ms-auto">
                    <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle show" data-bs-toggle="dropdown" aria-expanded="true" style="fill:gray;">
                        <img class="user_icon me-2" src="gui/user_data/icon" width="36" height="36">
                        <span class="username align-middle">UserName</span>
                    </a>
                    <ul class="dropdown-menu text-small shadow" style="position:absolute;inset:0px 0px auto auto;margin:0px;transform:translate(0px,34px);" data-popper-placement="bottom-end">
                        <div class="user_info_note ps-3 pe-3"></div>
                        <li><hr class="dropdown-divider"></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div id="main_container" class="container-fluid overflow-auto" style="margin-top:66px;height:calc(100vh - 100px);">
        <div class="d-flex flex-wrap align-items-center gap-2 my-2">
            <div class="input-group" style="max-width:420px;">
                <label class="input-group-text i18n">Keyword</label>
                <input id="kwd" type="text" class="form-control" placeholder="key name / id / provider">
                <button id="btn_search" type="button" class="btn btn-outline-secondary"><i class="fas fa-search"></i></button>
            </div>
            <button id="btn_refresh" type="button" class="btn btn-outline-secondary">
                <i class="fas fa-sync-alt"></i><span class="i18n ms-1">Refresh</span>
            </button>
            <button id="btn_new" type="button" class="btn btn-outline-primary ms-auto">
                <i class="fas fa-plus"></i><span class="i18n ms-1">New Key</span>
            </button>
        </div>

        <ul id="keystore_tabs" class="nav nav-tabs" role="tablist">
            <li class="nav-item" role="presentation"><a class="nav-link active" data-ktype="apikey" href="#" role="tab">apikey</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" data-ktype="signkey" href="#" role="tab">signkey</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" data-ktype="enckey" href="#" role="tab">enckey</a></li>
            <li class="nav-item" role="presentation"><a class="nav-link" data-ktype="cacert" href="#" role="tab">cacert</a></li>
        </ul>

        <div class="overflow-x-hidden overflow-y-auto" style="height:calc(100vh - 210px);">
            <div id="keystore_list" class="row g-3 p-1"></div>
        </div>
    </div>

    <div id="keystore_modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content novalidate">
                <div class="modal-header doc-header">
                    <h5 class="modal-title glow-text-cyan system-font i18n">KeyStore Save</h5>
                    <button type="button" class="btn btn-sf-icon btn_window_stack">
                        <i class="fa-regular fa-window-restore"></i>
                    </button>
                    <button type="button" class="btn btn-sf-icon btn_window">
                        <i class="fa-regular fa-window-maximize"></i>
                    </button>
                    <button type="button" class="btn btn-sf-icon" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fas fa-times fa-lg"></i>
                    </button>
                </div>
                <div class="modal-body" style="max-height:70vh;overflow-y:auto;">
                    <form id="keystore_form" class="row"></form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary i18n" data-bs-dismiss="modal">Close</button>
                    <button id="cmd_keystore_add" type="button" class="btn btn-outline-success i18n">Add</button>
                </div>
            </div>
        </div>
    </div>

    <div id="loading" class="position-absolute top-0 start-0 w-100 h-100 d-none" style="background:rgba(0, 0, 0, 0.3);z-index:10000;">
        <div class="text-center position-absolute top-50 start-50 w-100 translate-middle">
            <div class="spinner-border text-light" role="status">
                <span class="sr-only"></span>
            </div>
            <div>
                <button type="button" class="btn btn-outline-danger mt-3 bbforce">Back by force</button>
            </div>
        </div>
    </div>

    <footer>
        <span class="copyright"></span>
        <a id="appid_version" href="#" onclick="$('#versions_modal').modal('show');">cmdbox</a>
    </footer>

    <!-- ファイラーモーダル -->
    <div id="filer_modal" class="modal fade" style="z-index: 2000;" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <form id="filer_form" class="modal-content novalidate">
                <div class="modal-header doc-header">
                    <h5 class="modal-title glow-text-cyan system-font text-nowrap">Modal title</h5>
                    <div class="input-group p-1">
                        <button class="btn btn-outline-secondary dropdown-toggle filer_server_bot" type="button" data-bs-toggle="dropdown" aria-expanded="false">Current</button>'
                        <input name="filer_host" type="hidden" class="filer_host">
                        <input name="filer_port" type="hidden" class="filer_port">
                        <input name="filer_password" type="hidden" class="filer_password">
                        <input name="filer_svname" type="hidden" class="filer_svname">
                        <input name="filer_scope" type="hidden" class="filer_scope">
                        <input name="filer_client_data" type="hidden" class="filer_client_data">
                        <ul class="dropdown-menu filer_server"></ul>
                        <input type="text" class="form-control filer_address" aria-describedby="button-addon2">
                        <button class="btn btn-outline-secondary filer_address_bot" type="button" id="button-addon2">
                            <svg class="bi bi-arrow-right-circle" width="16" height="16" fill="currentColor"><use href="#btn_arrow_right_circle"></use></svg>
                        </button>
                    </div>
                    <button type="button" class="btn btn-sf-icon btn_window_stack">
                        <i class="fa-regular fa-window-restore"></i>
                    </button>
                    <button type="button" class="btn btn-sf-icon btn_window">
                        <i class="fa-regular fa-window-maximize"></i>
                    </button>
                    <button type="button" class="btn btn-sf-icon" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fas fa-times fa-lg"></i>
                    </button>
                </div>
                <div class="modal-body row">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary i18n" data-bs-dismiss="modal">Close</button>
                </div>
            </form>
        </div>
    </div>
    <!-- versionsモーダル -->
    <div id="versions_modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <form id="version_form" class="modal-content novalidate">
                <div class="modal-header doc-header">
                    <h5 class="modal-title glow-text-cyan system-font i18n">Versions</h5>
                    <button type="button" class="btn btn-sf-icon btn_window_stack"><i class="fa-regular fa-window-restore"></i></button>
                    <button type="button" class="btn btn-sf-icon btn_window"><i class="fa-regular fa-window-maximize"></i></button>
                    <button type="button" class="btn btn-sf-icon" data-bs-dismiss="modal" aria-label="Close"><i class="fas fa-times fa-lg"></i></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-tabs version-tabs" role="tablist"></ul>
                    <div class="tab-content version-content"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary i18n" data-bs-dismiss="modal">Close</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script type="text/javascript">
    document.querySelector('body').style.backgroundColor = 'var(--bs-body-bg)';
    document.querySelector('body').style.setProperty('--bs-body-bg', '#212529');
    document.querySelector('body').style.setProperty('--bs-tertiary-bg', '#2b3035');
    document.querySelector('body').style.setProperty('--bs-tertiary-bg-rgb', '43,48,53');
    document.querySelector('body').style.setProperty('--bs-secondary-bg', '#343a40');
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('body').style.setProperty('--bs-body-bg', null);
        document.querySelector('body').style.setProperty('--bs-tertiary-bg', null);
        document.querySelector('body').style.setProperty('--bs-tertiary-bg-rgb', null);
        document.querySelector('body').style.setProperty('--bs-secondary-bg', null);
    });
</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/bootstrap/bootstrap.min.5.3.0.css">
<link rel="stylesheet" href="assets/cmdbox/color_mode.css">
<link rel="stylesheet" href="assets/lightbox2/css/lightbox.min.css">
<link rel="stylesheet" href="assets/tree-menu/css/tree-menu.css">
<script type="text/javascript" src="assets/bootstrap/bootstrap.bundle.min.5.3.0.js"></script>
<script type="text/javascript" src="assets/jquery/jquery.min.3.2.0.js"></script>
<script type="text/javascript" src="assets/jquery-ui/jquery-ui.min.js"></script>
<script type="text/javascript" src="assets/jquery-resizable/jquery-resizable.min.js"></script>
<script type="text/javascript" src="assets/tree-menu/js/tree-menu.js"></script>
<script type="text/javascript" src="assets/lightbox2/js/lightbox.min.js"></script>
<script type="text/javascript" src="assets/dompurify/purify.js"></script>
<script type="text/javascript" src="assets/cmdbox/filer_modal.js"></script>
<script type="text/javascript" src="assets/cmdbox/common.js"></script>
<script type="text/javascript" src="assets/cmdbox/list_cmd.js"></script>
<script type="text/javascript" src="assets/keystore/main.js"></script>
</html>
