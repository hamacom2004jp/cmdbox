[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdbox"
dynamic = ["version"]
description = "cmdbox: It is a command line application with a plugin mechanism."
readme = "README.md"
authors = [
    { name = "hamacom2004jp", email = "hamacom2004jp@gmail.com" },
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "audit",
    "a2a",
    "agent",
    "cli",
    "cmdbox",
    "excel",
    "fastapi",
    "mcp",
    "redis",
    "restapi",
    "web"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: Japanese",
    "Programming Language :: Python",
    "Topic :: Utilities"
]
dependencies = [
    "argcomplete",
    "aiosqlite",
    "async-timeout",
    "asyncpg",
    "cffi",
    "cryptography",
    "fastapi",
    "debugpy",
    "gevent",
    "gunicorn",
    "itsdangerous",
    "numpy",
    "openpyxl",
    "Pillow",
    "plyer",
    "psycopg[binary]",
    "psycopg[pool]",
    "pyjwt",
    #"pystray",
    "python-multipart",
    "pycryptodome",
    "pyyaml",
    "questionary",
    "redis",
    "requests",
    "rich>=13.9.4,<14.0",
    "six",
    "starsessions[redis]",
    "sqlite_vec",
    "tabulate",
    "uvicorn",
    "wsproto",
    "wheel",
]

[project.optional-dependencies]
agent_mcp = [
    "pydantic>=2.0.0,<3.0.0",
    "fastmcp>=2.14.4",
    "mcp>=1.24.0,<2.0.0",
]
agent_adk = [
    "google-adk>=2.8,<2.9",
    "a2a-sdk>=1.0.0",
    "culsans>=0.11.0",
    "litellm[proxy]>=1.82.6", # >=1.93.1
    "prometheus-client>=0.26.0",
]
agent_mem = [
#    "sentence-transformers",
#    "transformers>=4.48.0",
#    "torch",
]
rag = [
    "chunklet-py",
    "pdfminer.six>=20250324",
    "python-docx>=1.2.0,<2.0",
    "mammoth>=1.9.1,<2.0",
    "markdownify>=1.1.0,<2.0",
    "striprtf>=0.0.29,<1.0",
    "pylatexenc>=2.10",
    #"odfpy>=1.4.1,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "tabulate2>=1.10.2,<2.0",
    "langchain_community",
    "markdown",
    "pdfplumber",
    "scikit-learn"
]
omni = [
    "accelerate>=1.12.0",
    "qwen-omni-utils>=0.0.9",
    "torchvision>=0.25.0",
]
saml = [
    "python3-saml",
    "xmlsec==1.3.13",
]
dev = [
    "build",
    "docutils>=0.21.2,<1.0",
    "collectlicense",
    "pipdeptree",
    "pytest",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx_fontawesome",
    "sphinx-intl",
    "sphinx-sitemap",
    "twine",
    "wheel",
]
app = [
    "cmdbox[agent_mcp, agent_adk, rag]"
]

[project.urls]
Homepage = "https://github.com/hamacom2004jp/cmdbox"
Documentation = "https://hamacom2004jp.github.io/cmdbox/index.html"
Repository = "https://github.com/hamacom2004jp/cmdbox"

[project.scripts]
cmdbox = "cmdbox.app.app:main"

# ----------------------------------------------------------------------
# setuptools固有の設定 (setup.cfgに相当する内容をsetuptoolsテーブルで記述)
# ----------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cmdbox*"]
# Exclude non-Python directories that don't contain __init__.py
exclude = [
    "cmdbox.edge"
]
[tool.setuptools.package-data]
# setup()のpackage_dataとexclude_package_dataに相当
cmdbox = [
    "*.yml",
    "extensions/**",
    "extensions/**/*",
    "extensions/sample_project/.vscode/**",
    "docker/**",
    "docker/**/*",
    "licenses/*",
    "web/**",
    "web/**/*",
]

[tool.setuptools.exclude-package-data]
cmdbox = [
    "extensions/data/*.json",
    "extensions/data/*/*.jpg",
    "extensions/data/*/*.svg",
]
